name: Workflow avec OpenBao

on:
  push:
    branches:
      - main
  workflow_dispatch:

# id-token: write est nécessaire pour l'identité fédérée Tailscale
permissions:
  id-token: write
  contents: read

jobs:
  execute-with-openbao-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        
      - name: Debug - afficher les claims OIDC
        run: |
          TOKEN="$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=test" | jq -r .value)"
          echo "::add-mask::$TOKEN"
          PAYLOAD="$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')"
          while [ $((${#PAYLOAD} % 4)) -ne 0 ]; do PAYLOAD="${PAYLOAD}="; done
          echo "$PAYLOAD" | base64 -d | jq '{iss, sub}'

      - name: Se connecter à Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: ${{ vars.TAILSCALE_OPENBAO_HOST }}

      - name: Vérifier que OpenBao répond
        env:
          BAO_ADDR: ${{ vars.BAO_ADDR }}
        run: |
          curl -sS --max-time 10 -o /dev/null -w "HTTP %{http_code}\n" "$BAO_ADDR/v1/sys/health"

      - name: Récupérer les secrets depuis OpenBao
        env:
          BAO_ADDR: ${{ vars.BAO_ADDR }}
          BAO_ROLE_ID: ${{ secrets.BAO_ROLE_ID }}
          BAO_SECRET_ID: ${{ secrets.BAO_SECRET_ID }}
        shell: bash
        run: |
          set -euo pipefail

          # Authentification AppRole
          BAO_TOKEN="$(
            curl -sS --fail-with-body -X POST "$BAO_ADDR/v1/auth/approle/login" \
              -d "$(jq -n --arg r "$BAO_ROLE_ID" --arg s "$BAO_SECRET_ID" \
                    '{role_id:$r, secret_id:$s}')" \
            | jq -r '.auth.client_token'
          )"
          echo "::add-mask::$BAO_TOKEN"

          # Lecture du secret (KV v2 : le chemin contient /data/)
          SECRET_VALUE="$(
            curl -sS --fail-with-body -H "X-Vault-Token: $BAO_TOKEN" \
              "$BAO_ADDR/v1/secret/data/mon-workflow/config" \
            | jq -r '.data.data.value'
          )"
          echo "::add-mask::$SECRET_VALUE"

          # Rendre la valeur disponible aux étapes suivantes
          echo "MON_SECRET=$SECRET_VALUE" >> "$GITHUB_ENV"

      - name: Exécuter le workflow
        run: |
          test -n "$MON_SECRET" && echo "Secret chargé depuis OpenBao (valeur masquée)"
