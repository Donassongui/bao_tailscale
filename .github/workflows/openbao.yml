name: Workflow avec OpenBao

# Déclenchement du workflow :
# - automatiquement lors d'un push sur main ;
# - manuellement depuis l'onglet Actions de GitHub.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Autorisations nécessaires pour que GitHub fournisse
# un token OIDC à Tailscale.
permissions:
  id-token: write
  contents: read

jobs:
  execute-with-openbao-secrets:
    runs-on: ubuntu-latest

    steps:
      # Récupération du code source du projet.
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      # Connexion temporaire du runner GitHub au réseau Tailscale.
      # Cette étape permet d'atteindre la machine locale où OpenBao est installé.
      - name: Se connecter à Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: ${{ vars.TAILSCALE_OPENBAO_HOST }}

      # Installation de la CLI OpenBao sur le runner GitHub.
      - name: Installer OpenBao
        uses: openbao/setup-openbao@v1

      # Authentification du workflow auprès d'OpenBao
      # avec le role_id et le secret_id AppRole.
      - name: S’authentifier auprès d’OpenBao
        env:
          BAO_ADDR: ${{ vars.BAO_ADDR }}
          BAO_ROLE_ID: ${{ secrets.BAO_ROLE_ID }}
          BAO_SECRET_ID: ${{ secrets.BAO_SECRET_ID }}
        shell: bash
        run: |
          set -euo pipefail

          BAO_TOKEN="$(
            bao write -field=token auth/approle/login \
              role_id="$BAO_ROLE_ID" \
              secret_id="$BAO_SECRET_ID"
          )"

          # Masquage du token dans les logs GitHub.
          echo "::add-mask::$BAO_TOKEN"

          # Transmission temporaire du token aux étapes suivantes.
          echo "BAO_TOKEN=$BAO_TOKEN" >> "$GITHUB_ENV"

      # Récupération des valeurs stockées dans OpenBao.
      # Ces valeurs ne sont pas enregistrées dans GitHub.
      - name: Récupérer les secrets OpenBao
        env:
          BAO_ADDR: ${{ vars.BAO_ADDR }}
          BAO_TOKEN: ${{ env.BAO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          SECRET_VALUE="$(
            bao kv get -field=value secret/mon-workflow/config
          )"

          # Masquage du secret dans les logs.
          echo "::add-mask::$SECRET_VALUE"

          # Exemple d'utilisation du secret par le workflow.
          echo "Secret récupéré depuis OpenBao."

      # Étape métier du workflow.
      # Les commandes réelles seront ajoutées ici.
      - name: Exécuter le workflow
        run: |
          echo "Exécution avec les secrets récupérés depuis OpenBao"
